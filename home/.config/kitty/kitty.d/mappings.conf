map ctrl+k kitten nvim_nav.py kitty top
map ctrl+j kitten nvim_nav.py kitty bottom
map ctrl+h kitten nvim_nav.py kitty left
map ctrl+l kitten nvim_nav.py kitty right
map ctrl+t launch --type=overlay --copy-env ~/.dotfiles/bin/kitty-tab-manager

map cmd+t launch --type=tab --cwd=current

map shift+left previous_tab
map shift+right next_tab

map cmd+shift+left move_tab_backward
map cmd+shift+right move_tab_forward

map alt+w resize_window wider
map alt+t resize_window taller
map alt+s resize_window shorter
map alt+n resize_window narrower

map ctrl+a>| launch --location=vsplit --cwd=current
map ctrl+a>- launch --location=hsplit --cwd=current
map ctrl+a>m swap_with_window
map ctrl+a>c launch 
	\ --type=overlay 
	\ --stdin-source=@screen_scrollback 
	\ nvim -i NONE -M -u ~/.config/nvim/scrollback.lua --noplugin
# ctrl+a>hjkl moves a border, then h/j/k/l keep moving borders until another
# key is pressed or 1s passes. A new mode needs an entry key, so it's defined
# on ctrl+a>h, which is then remapped to do the first move before entering it.
map --new-mode border_resize --on-unknown passthrough_and_end --timeout 1.0 ctrl+a>h
map --mode border_resize h kitten border_resize.py left
map --mode border_resize j kitten border_resize.py down
map --mode border_resize k kitten border_resize.py up
map --mode border_resize l kitten border_resize.py right
map --mode border_resize esc pop_keyboard_mode
map ctrl+a>h combine : kitten border_resize.py left : push_keyboard_mode border_resize
map ctrl+a>j combine : kitten border_resize.py down : push_keyboard_mode border_resize
map ctrl+a>k combine : kitten border_resize.py up : push_keyboard_mode border_resize
map ctrl+a>l combine : kitten border_resize.py right : push_keyboard_mode border_resize
map ctrl+a>z start_resizing_window
map ctrl+a>r load_config_file
map ctrl+a>f kitten choose-files
map ctrl+a>g launch
	\ --type overlay
	\ --copy-env
	\ --env XDG_CONFIG_HOME=~/.config
	\ --cwd=current
	\ lazygit status

map shift+enter send_text normal,application \n

map ctrl+a>w detach_window ask
